<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="2048: vuốt để gộp hai ô cùng số, tới ô 2048.">
<title>2048</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='5' fill='%23edc22e'/%3E%3Ctext x='16' y='20' font-size='9' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'%3E2048%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Games">
<meta name="theme-color" content="#e9e7e1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<style>
:root{
    --bg:#e9e7e1; --panel:#f7f6f2; --text:#222; --muted:#666; --line:#c9c6bd;
    --board:#bbada0; --slot:#cdc1b4;
    --btn:#fff; --btn-hover:#f0eee8; --accent:#1f6feb;
    --shadow:0 2px 10px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
        --bg:#14161a; --panel:#1d2026; --text:#eee; --muted:#9aa0a8; --line:#333842;
        --board:#3b3631; --slot:#4d463f;
        --btn:#262a31; --btn-hover:#2f343c; --accent:#58a6ff;
        --shadow:0 2px 10px rgba(0,0,0,.5);
    }
}
:root[data-theme="dark"]{
    --bg:#14161a; --panel:#1d2026; --text:#eee; --muted:#9aa0a8; --line:#333842;
    --board:#3b3631; --slot:#4d463f;
    --btn:#262a31; --btn-hover:#2f343c; --accent:#58a6ff;
    --shadow:0 2px 10px rgba(0,0,0,.5);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{ background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      padding:12px 16px 24px; min-height:100vh; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
.wrap{ width:100%; max-width:480px; margin:0 auto; }

.top{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.stat{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 10px; box-shadow:var(--shadow); min-width:0; position:relative; }
.stat.r{ text-align:right; }
.stat .k{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.stat .v{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2; }
.plus{ position:absolute; left:10px; top:22px; font-weight:700; color:var(--accent); pointer-events:none; animation:plus .7s ease-out forwards; }
@keyframes plus{ from{ opacity:1; transform:none; } to{ opacity:0; transform:translateY(-22px); } }

/* board: 4x4 slots under absolutely placed tiles; sizes from the board width (cqw) */
.board{ position:relative; width:100%; aspect-ratio:1; background:var(--board); border-radius:8px; container-type:inline-size;
        touch-action:none; user-select:none; -webkit-user-select:none;
        --p:3cqw; --G:2.6cqw; --c:calc((100cqw - 2 * var(--p) - 3 * var(--G)) / 4); }
.slots, .tiles{ position:absolute; inset:var(--p); }
.slots{ display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:var(--G); }
.slots div{ background:var(--slot); border-radius:6px; }
.tile{ position:absolute; width:var(--c); height:var(--c); left:calc(var(--x) * (var(--c) + var(--G))); top:calc(var(--y) * (var(--c) + var(--G)));
       transition:left .1s ease-in-out, top .1s ease-in-out; z-index:1; }
.tile b{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:6px; font-weight:800;
         font-size:var(--fs, 10cqw); background:var(--tb); color:var(--tc); font-variant-numeric:tabular-nums; }
.tile.new b{ animation:appear .18s ease-out .08s both; }
.tile.merged{ z-index:2; }
.tile.merged b{ animation:pop .2s ease-out .08s; }
@keyframes appear{ from{ transform:scale(0); } to{ transform:scale(1); } }
@keyframes pop{ 0%{ transform:scale(1); } 50%{ transform:scale(1.18); } 100%{ transform:scale(1); } }

.bar{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.bar button{ flex:1 1 auto; }
button{ font:inherit; font-size:14px; color:var(--text); background:var(--btn); border:1px solid var(--line); border-radius:8px;
        padding:9px 12px; cursor:pointer; box-shadow:var(--shadow); white-space:nowrap; }
button:hover{ background:var(--btn-hover); }
button:disabled{ opacity:.45; cursor:default; }
button.icon{ flex:0 0 auto; width:42px; padding:9px 0; }
#msg{ min-height:20px; text-align:center; color:var(--muted); font-size:14px; margin-top:10px; }

/* phones: the board almost edge to edge (2px each side, clear of the notch in landscape) */
@media (max-width:520px){
    .board{ width:calc(100vw - 4px - env(safe-area-inset-left) - env(safe-area-inset-right));
            margin-left:calc(50% - 50vw + 2px + env(safe-area-inset-left)); border-radius:0; }
}

.dlg{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
.dlg[hidden]{ display:none; }
.box{ background:var(--panel); color:var(--text); border-radius:12px; padding:18px; width:100%; max-width:360px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
.box h2{ font-size:18px; margin-bottom:10px; }
.box p{ color:var(--muted); font-size:14px; line-height:1.45; margin-bottom:10px; }
.box .acts{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
.box button.pri{ background:var(--accent); color:#fff; border-color:var(--accent); }
.rules{ font-size:14px; line-height:1.5; padding-left:18px; margin-bottom:12px; }
.rules li{ margin-bottom:4px; }
</style>
</head>
<body>
<script src="../menu.js" data-game="2048"></script>
<div class="wrap">
    <div class="top">
        <div class="stat" id="scoreBox"><div class="k">Điểm</div><div class="v" id="score">0</div></div>
        <div class="stat r"><div class="k">Kỷ lục</div><div class="v" id="best">0</div></div>
    </div>

    <div class="board" id="board" aria-label="Bàn 4×4. Vuốt hoặc dùng phím mũi tên.">
        <div class="slots" id="slots"></div>
        <div class="tiles" id="tiles"></div>
    </div>

    <div id="msg"></div>

    <div class="bar">
        <button id="newBtn">Ván mới</button>
        <button id="undoBtn" disabled title="Đi lại nước vừa rồi (1 lần)">↶ Đi lại</button>
        <button id="helpBtn" class="icon" title="Luật chơi" aria-label="Luật chơi">?</button>
    </div>
</div>

<div class="dlg" id="dlg" hidden><div class="box" id="dlgBox" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
/* =========================================================
   2048: swipe (or arrow keys) to slide every tile; two tiles of the
   same number that meet become one with their sum. After each move a
   2 (sometimes a 4) appears. Reach 2048 to win, then keep going.
   Saved in this browser only (localStorage): the game and the best score.
   ========================================================= */
const N = 4, SLIDE_MS = 100;
const KEY = {game: 'g2048.game', best: 'g2048.best'};
const COLORS = {
    2: ['#eee4da', '#776e65'], 4: ['#ede0c8', '#776e65'], 8: ['#f2b179', '#fff'], 16: ['#f59563', '#fff'],
    32: ['#f67c5f', '#fff'], 64: ['#f65e3b', '#fff'], 128: ['#edcf72', '#fff'], 256: ['#edcc61', '#fff'],
    512: ['#edc850', '#fff'], 1024: ['#edc53f', '#fff'], 2048: ['#edc22e', '#fff']
};
const $ = id => document.getElementById(id);
const store = {
    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let S;              // {cells[16]: number (0 = empty), score, won, over, keep (playing on after 2048)}
let undo = null;
let busy = false;
let tiles = {};     // shown tile elements by id
let ids = [];       // tile id at each cell
let nextId = 1;

for(let i = 0; i < N * N; i++) $('slots').appendChild(document.createElement('div'));

function newGame(){
    S = {cells: new Array(N * N).fill(0), score: 0, won: false, over: false, keep: false, beat: false};
    undo = null;
    $('tiles').textContent = ''; tiles = {}; ids = new Array(N * N).fill(0);
    addRandom(); addRandom();
    save(); draw([]); say('Vuốt lên, xuống, trái, phải để gộp các ô.');
}

function addRandom(){
    const free = [];
    S.cells.forEach((v, i) => { if(!v) free.push(i); });
    if(!free.length) return -1;
    const i = free[Math.floor(Math.random() * free.length)];
    S.cells[i] = Math.random() < 0.9 ? 2 : 4;
    ids[i] = nextId++;
    return i;
}

/* slide in direction d (0 up, 1 right, 2 down, 3 left): the new cells and
   tile ids, the moves [{from, to, merge, id, into}] and the points, or null
   when nothing would move */
function slide(d){
    const cells = new Array(N * N).fill(0), nid = new Array(N * N).fill(0), moves = [];
    let gained = 0, moved = false;
    for(let line = 0; line < N; line++){
        const idx = [];                               // this line, from the edge the tiles move to
        for(let k = 0; k < N; k++){
            idx.push(d === 0 ? k * N + line : d === 2 ? (N - 1 - k) * N + line : d === 3 ? line * N + k : line * N + (N - 1 - k));
        }
        let t = -1, canMerge = false;                 // last filled slot; may it still take a merge?
        for(const i of idx){
            const v = S.cells[i];
            if(!v) continue;
            if(canMerge && cells[idx[t]] === v){
                const to = idx[t];
                cells[to] = v * 2; gained += v * 2;
                moves.push({from: i, to, merge: true, id: ids[i], into: nid[to]});
                canMerge = false; moved = true;        // a merged tile doesn't merge again this move
            }else{
                const to = idx[++t];
                cells[to] = v; nid[to] = ids[i];
                moves.push({from: i, to, merge: false, id: ids[i]});
                canMerge = true;
                if(to !== i) moved = true;
            }
        }
    }
    return moved ? {cells, nid, moves, gained} : null;
}

function move(d){
    if(busy || S.over || !$('dlg').hidden) return;
    const r = slide(d);
    if(!r) return;
    busy = true;
    undo = {state: JSON.parse(JSON.stringify(S)), ids: ids.slice()};
    S.cells = r.cells; S.score += r.gained; ids = r.nid;
    const placed = addRandom();
    if(r.gained) showPlus(r.gained);
    draw(r.moves, placed);
    if(S.score > best()){ S.beat = true; store.set(KEY.best, S.score); }
    if(!S.won && S.cells.some(v => v >= 2048)){ S.won = true; }
    if(!canMove()) S.over = true;
    save();
    setTimeout(() => {
        busy = false;
        if(S.won && !S.keep) winDlg();
        else if(S.over) overDlg();
    }, SLIDE_MS + 120);
}

function canMove(){
    for(let i = 0; i < N * N; i++){
        if(!S.cells[i]) return true;
        const x = i % N, y = (i - x) / N;
        if(x < N - 1 && S.cells[i] === S.cells[i + 1]) return true;
        if(y < N - 1 && S.cells[i] === S.cells[i + N]) return true;
    }
    return false;
}

/* ---------- drawing ---------- */
function tileEl(id, v){
    const t = document.createElement('div');
    t.className = 'tile';
    t.innerHTML = '<b></b>';
    setVal(t, v);
    $('tiles').appendChild(t);
    tiles[id] = t;
    return t;
}
function setVal(t, v){
    const c = COLORS[v] || ['#3c3a32', '#fff'];
    const b = t.firstChild;
    b.textContent = v;
    b.style.setProperty('--tb', c[0]); b.style.setProperty('--tc', c[1]);
    const digits = String(v).length;
    b.style.setProperty('--fs', [11, 11, 9, 7.2, 5.8, 5][Math.min(digits, 6) - 1] + 'cqw');
}
function place(t, i){ t.style.setProperty('--x', i % N); t.style.setProperty('--y', Math.floor(i / N)); }

/* moves: slide the moving tiles, then merge and show the new one */
function draw(moves, placed){
    for(const m of moves){
        const t = tiles[m.id];
        if(!t) continue;
        t.classList.remove('new', 'merged');
        place(t, m.to);
        if(m.merge){
            delete tiles[m.id];
            setTimeout(() => t.remove(), SLIDE_MS);
            const into = tiles[m.into];
            if(into) setTimeout(() => { setVal(into, S.cells[m.to]); into.classList.remove('merged'); void into.offsetWidth; into.classList.add('merged'); }, SLIDE_MS);
        }
    }
    // tiles not on the board yet (start, undo, resume, the new one)
    for(let i = 0; i < N * N; i++){
        if(!S.cells[i] || tiles[ids[i]]) continue;
        const t = tileEl(ids[i], S.cells[i]);
        place(t, i);
        if(i === placed || !moves.length) t.classList.add('new');
    }
    // drop tiles that are no longer on the board (undo)
    const live = new Set(ids.filter((id, i) => S.cells[i]));
    for(const id of Object.keys(tiles)) if(!live.has(+id)){ tiles[id].remove(); delete tiles[id]; }
    $('score').textContent = S.score;
    $('best').textContent = Math.max(best(), S.score);
    $('undoBtn').disabled = !undo || S.over;
}

function showPlus(n){
    const p = document.createElement('div');
    p.className = 'plus'; p.textContent = '+' + n;
    $('scoreBox').appendChild(p);
    setTimeout(() => p.remove(), 700);
}
function best(){ return +store.get(KEY.best) || 0; }
function say(t){ $('msg').textContent = t || ''; }
function save(){ store.set(KEY.game, {...S, ids}); }

/* ---------- input: swipe, arrows, WASD ---------- */
let start = null;
const board = $('board');
board.addEventListener('pointerdown', e => { start = {x: e.clientX, y: e.clientY, id: e.pointerId}; });
board.addEventListener('pointerup', e => {
    if(!start || e.pointerId !== start.id) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
});
board.addEventListener('pointercancel', () => { start = null; });
document.addEventListener('keydown', e => {
    if(window.gameMenuOpen && gameMenuOpen()) return;
    if(!$('dlg').hidden){ if(e.key === 'Escape') closeDlg(); return; }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); return $('undoBtn').click(); }
    const d = {ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3}[e.key];
    if(d !== undefined && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); move(d); }
});

$('newBtn').onclick = () => {
    if(S.over || S.score === 0) return newGame();
    confirmBox('Ván mới?', 'Ván đang chơi (' + S.score + ' điểm) sẽ bị bỏ.', 'Ván mới', newGame);
};
$('undoBtn').onclick = () => {
    if(!undo || busy) return;
    S = undo.state; ids = undo.ids; undo = null;
    $('tiles').textContent = ''; tiles = {};
    save(); draw([]); say('Đã đi lại nước vừa rồi.');
};
$('helpBtn').onclick = () => openDlg('<h2>Luật chơi</h2><ul class="rules">'
    + '<li>Vuốt lên, xuống, trái hoặc phải (máy tính: phím mũi tên): mọi ô trượt hết về phía đó.</li>'
    + '<li>Hai ô cùng số chạm nhau thì gộp thành một ô bằng tổng, và bạn được cộng số điểm đó.</li>'
    + '<li>Sau mỗi lượt có một ô 2 (đôi khi 4) mới xuất hiện.</li>'
    + '<li>Tạo được ô <b>2048</b> là thắng; có thể chơi tiếp để lấy điểm cao hơn. Hết đường đi là hết ván.</li>'
    + '<li>Mỗi lượt có thể đi lại 1 lần. Ván đang chơi tự lưu trên máy này.</li>'
    + '</ul><div class="acts"><button class="pri" id="dClose">Đã hiểu</button></div>', () => { $('dClose').onclick = closeDlg; });

function winDlg(){
    say('Bạn đã tạo được ô 2048!');
    openDlg('<h2>2048!</h2><p>Bạn thắng với <b>' + S.score + '</b> điểm. Chơi tiếp để lấy điểm cao hơn?</p>'
        + '<div class="acts"><button id="dNew">Ván mới</button><button class="pri" id="dGo">Chơi tiếp</button></div>', () => {
        $('dGo').onclick = () => { S.keep = true; save(); closeDlg(); if(S.over) overDlg(); };
        $('dNew').onclick = () => { closeDlg(); newGame(); };
    });
}
function overDlg(){
    const rec = !!S.beat;
    say('Hết đường đi: ván kết thúc với ' + S.score + ' điểm.');
    openDlg('<h2>' + (rec ? 'Kỷ lục mới!' : 'Hết ván') + '</h2><p>Bạn được <b>' + S.score + '</b> điểm, ô lớn nhất <b>' + Math.max(...S.cells) + '</b>.</p>'
        + '<div class="acts"><button id="dClose">Đóng</button><button class="pri" id="dNew">Ván mới</button></div>', () => {
        $('dClose').onclick = closeDlg;
        $('dNew').onclick = () => { closeDlg(); newGame(); };
    });
}

function openDlg(html, init){ $('dlgBox').innerHTML = html; $('dlg').hidden = false; init && init(); }
function closeDlg(){ $('dlg').hidden = true; $('dlgBox').innerHTML = ''; }
function confirmBox(title, text, okText, ok){
    openDlg('<h2>' + title + '</h2><p>' + text + '</p><div class="acts"><button id="dNo">Hủy</button><button class="pri" id="dYes">' + okText + '</button></div>', () => {
        $('dNo').onclick = closeDlg;
        $('dYes').onclick = () => { closeDlg(); ok(); };
    });
}
$('dlg').addEventListener('click', e => { if(e.target === $('dlg')) closeDlg(); });

/* ---------- start ---------- */
const saved = store.get(KEY.game);
const ok = saved && Array.isArray(saved.cells) && saved.cells.length === N * N && saved.cells.every(v => Number.isInteger(v) && v >= 0)
    && Array.isArray(saved.ids) && saved.ids.length === N * N && Number.isFinite(saved.score);
if(ok && !saved.over){
    S = {cells: saved.cells, score: saved.score, won: !!saved.won, over: false, keep: !!saved.keep, beat: !!saved.beat};
    ids = saved.cells.map((v, i) => v ? nextId++ : 0);
    draw([]); say('Tiếp tục ván đang chơi.');
}else{
    newGame();
    if(!best()) setTimeout(() => $('helpBtn').click(), 50);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>Phá gạch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='5' fill='%2314161a'/%3E%3Crect x='5' y='6' width='10' height='5' rx='1' fill='%23ef5350'/%3E%3Crect x='17' y='6' width='10' height='5' rx='1' fill='%23ffa726'/%3E%3Crect x='5' y='13' width='10' height='5' rx='1' fill='%2366bb6a'/%3E%3Ccircle cx='20' cy='20' r='2.5' fill='%23fff'/%3E%3Crect x='10' y='24' width='12' height='3' rx='1.5' fill='%2358a6ff'/%3E%3C/svg%3E">
<link rel="manifest" href="../manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
    --bg:#e9e7e1; --panel:#f7f6f2; --text:#222; --muted:#666; --line:#c9c6bd;
    --field:#fbfaf6; --field-line:#d8d4c9; --paddle:#1f6feb; --ball:#2b2f36; --steel:#9aa0a8;
    --btn:#fff; --btn-hover:#f0eee8; --accent:#1f6feb;
    --shadow:0 2px 10px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
        --bg:#14161a; --panel:#1d2026; --text:#eee; --muted:#9aa0a8; --line:#333842;
        --field:#0e1014; --field-line:#2a2e36; --paddle:#58a6ff; --ball:#f2f2f2; --steel:#6b727c;
        --btn:#262a31; --btn-hover:#2f343c; --accent:#58a6ff;
        --shadow:0 2px 10px rgba(0,0,0,.5);
    }
}
:root[data-theme="dark"]{
    --bg:#14161a; --panel:#1d2026; --text:#eee; --muted:#9aa0a8; --line:#333842;
    --field:#0e1014; --field-line:#2a2e36; --paddle:#58a6ff; --ball:#f2f2f2; --steel:#6b727c;
    --btn:#262a31; --btn-hover:#2f343c; --accent:#58a6ff;
    --shadow:0 2px 10px rgba(0,0,0,.5);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{ background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      padding:12px 16px 24px; min-height:100vh; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
.wrap{ width:100%; max-width:480px; margin:0 auto; }

.top{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px; }
.stat{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 10px; box-shadow:var(--shadow); min-width:0; }
.stat .k{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
.stat .v{ font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2; overflow:hidden; text-overflow:ellipsis; }

/* the playing field: 3:4, full width */
.field{ display:block; width:100%; aspect-ratio:3/4; margin:0 auto;
        background:var(--field); border:1px solid var(--field-line); border-radius:8px;
        touch-action:none; user-select:none; -webkit-user-select:none; cursor:none; }

.bar{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.bar button{ flex:1 1 auto; }
button{ font:inherit; font-size:14px; color:var(--text); background:var(--btn); border:1px solid var(--line); border-radius:8px;
        padding:9px 12px; cursor:pointer; box-shadow:var(--shadow); white-space:nowrap; }
button:hover{ background:var(--btn-hover); }
button:disabled{ opacity:.45; cursor:default; }
button.icon{ flex:0 0 auto; width:42px; padding:9px 0; }
/* the strip under the field (with the hint text) also moves the paddle */
#msg{ min-height:48px; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--muted); font-size:14px;
      padding:4px 8px; touch-action:none; user-select:none; -webkit-user-select:none; }

/* phones: the field almost edge to edge (2px each side, clear of the notch in landscape) */
@media (max-width:520px){
    body{ padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); }
    .top{ gap:6px; }
    .stat{ padding:5px 8px; }
    .stat .v{ font-size:18px; }
    .field{ width:calc(100vw - 4px - env(safe-area-inset-left) - env(safe-area-inset-right));
            margin-left:auto; margin-right:auto; position:relative; left:50%; transform:translateX(-50%); border-radius:0; border-left:0; border-right:0; }
}

.dlg{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
.dlg[hidden]{ display:none; }
.box{ background:var(--panel); color:var(--text); border-radius:12px; padding:18px; width:100%; max-width:360px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
.box h2{ font-size:18px; margin-bottom:10px; }
.box p{ color:var(--muted); font-size:14px; line-height:1.45; margin-bottom:10px; }
.box .acts{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
.box button.pri{ background:var(--accent); color:#fff; border-color:var(--accent); }
.rules{ font-size:14px; line-height:1.5; padding-left:18px; margin-bottom:12px; }
.rules li{ margin-bottom:4px; }
.pu{ display:inline-block; min-width:22px; padding:0 4px; border-radius:6px; color:#fff; font-weight:700; font-size:12px; text-align:center; line-height:16px; }
</style>

<body>
<script src="../menu.js" data-game="brick"></script>
<div class="wrap">
    <div class="top">
        <div class="stat"><div class="k">Điểm</div><div class="v" id="score">0</div></div>
        <div class="stat"><div class="k">Màn</div><div class="v" id="level">1</div></div>
        <div class="stat"><div class="k">Mạng</div><div class="v" id="lives">3</div></div>
        <div class="stat"><div class="k">Kỷ lục</div><div class="v" id="best">0</div></div>
    </div>

    <canvas class="field" id="field" aria-label="Sân chơi. Kéo để di chuyển thanh đỡ, chạm để phóng bóng. Máy tính: chuột hoặc phím mũi tên, phím cách."></canvas>

    <div id="msg"></div>

    <div class="bar">
        <button id="newBtn">Ván mới</button>
        <button id="pauseBtn" disabled>Tạm dừng</button>
        <button id="soundBtn" class="icon" title="Âm thanh" aria-label="Âm thanh"></button>
        <button id="helpBtn" class="icon" title="Luật chơi" aria-label="Luật chơi">?</button>
    </div>
</div>

<div class="dlg" id="dlg" hidden><div class="box" id="dlgBox" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
/* =========================================================
   Phá gạch (brick breaker): move the paddle, bounce the ball, break
   every brick to clear the level. Later levels have more rows, bricks
   that take 2 or 3 hits, steel bricks that never break and a faster
   ball. Some bricks drop a power-up: wider paddle, 3 balls, slow ball,
   extra life.
   The field is W x H logical units, scaled to the canvas.
   Saved in this browser only (localStorage): the game (at the start of
   the ball, without power-ups), the best score and the sound setting.
   ========================================================= */
const W = 360, H = 480;
const COLS = 10, BX = 8, BY = 44, GAP = 3, BW = (W - 2 * BX - (COLS - 1) * GAP) / COLS, BH = 14;
const PY = H - 34, PH = 10, PW = 64, PW_WIDE = 100, R = 6;
const LIVES = 3, MAX_BALLS = 6, MAX_ANGLE = Math.PI / 3;
const KEY = {game: 'brick.game', best: 'brick.best', sound: 'brick.sound'};
const ROW_COLORS = ['#ef5350', '#ff7043', '#ffa726', '#fdd835', '#66bb6a', '#26a69a', '#42a5f5', '#5c6bc0', '#ab47bc'];
const POWERS = {
    wide:  {label: 'W', color: '#1e88e5', name: 'Thanh đỡ dài'},
    multi: {label: '3', color: '#8e24aa', name: 'Ba bóng'},
    slow:  {label: 'S', color: '#00897b', name: 'Bóng chậm'},
    life:  {label: '+', color: '#e53935', name: 'Thêm mạng'}
};
const $ = id => document.getElementById(id);
const store = {
    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let S;              // {level, score, lives, hp[]: per brick, 0 = gone, -1 = steel; rows, over, beat}
let mode = 'ready'; // ready (ball on the paddle), play, pause, over
let balls = [];     // {x, y, vx, vy}
let drops = [];     // falling power-ups {x, y, type}
let bits = [];      // pieces of broken bricks {x, y, vx, vy, t, c}
let px = W / 2, pw = PW, hold = 0;   // paddle centre and width; ball offset on the paddle before launch
let wideT = 0, slowT = 0;            // seconds left of each power-up
let speedUp = 1;                     // grows a little with every paddle hit
let banner = null;                   // {text, t}
let soundOn = store.get(KEY.sound) !== false;

/* ---------- levels ---------- */
function layout(level){
    const rows = Math.min(4 + Math.ceil(level / 2), 9);
    const kind = (level - 1) % 6;
    const hp = new Array(rows * COLS).fill(0);
    for(let r = 0; r < rows; r++) for(let c = 0; c < COLS; c++){
        const m = Math.min(c, COLS - 1 - c);              // distance from the side
        let on;
        switch(kind){
            case 0: on = true; break;                                     // full wall
            case 1: on = m >= (rows - 1 - r) / 2 - 0.5; break;               // pyramid
            case 2: on = (r + c) % 2 === 0 || r === 0; break;             // checker with a roof
            case 3: on = c !== 4 && c !== 5; break;                       // two towers
            case 4: on = Math.abs(r - (rows - 1) / 2) + Math.abs(c - 4.5) <= rows / 2 + 1.5; break; // diamond
            default: on = r % 2 === 0 || c % 3 === 0;                     // stripes
        }
        if(!on) continue;
        let h = 1 + (r < Math.floor((level - 1) / 2) ? 1 : 0) + (r < Math.floor((level - 4) / 3) ? 1 : 0);
        hp[r * COLS + c] = Math.min(h, 3);
    }
    // steel from level 7: a few bricks that never break, never closing a column
    if(level >= 7 && (kind === 0 || kind === 3 || kind === 5)){
        const r = rows - 2;
        for(const c of [1, 8]) if(hp[r * COLS + c]) hp[r * COLS + c] = -1;
        if(level >= 9) for(const c of [3, 6]) if(hp[(r - 2) * COLS + c]) hp[(r - 2) * COLS + c] = -1;
    }
    return {rows, hp};
}
function baseSpeed(level){ return Math.min(250 + 15 * (level - 1), 400); }
function speed(){ return baseSpeed(S.level) * speedUp * (slowT > 0 ? 0.65 : 1); }
function left(){ return S.hp.reduce((n, h) => n + (h > 0), 0); }

function newGame(){
    S = {level: 1, score: 0, lives: LIVES, over: false, beat: false, ...layout(1)};
    startLevel(true);
    say('Kéo để di chuyển thanh đỡ, chạm vào sân để phóng bóng.');
}
function startLevel(fresh){
    if(fresh === false){ const L = layout(S.level); S.rows = L.rows; S.hp = L.hp; }
    banner = {text: 'Màn ' + S.level, t: 1.6};
    resetBall();
    save(); hud();
}
/* the ball back on the paddle, power-ups gone */
function resetBall(){
    mode = 'ready';
    balls = [{x: px, y: PY - R, vx: 0, vy: 0}];
    hold = 0; drops = []; wideT = 0; slowT = 0; speedUp = 1;
    setPause();
}
function launch(){
    if(mode !== 'ready') return;
    unlockAudio();
    const a = (Math.random() * 2 - 1) * Math.PI / 10 + hold / (pw / 2) * Math.PI / 6;
    const s = speed();
    balls[0].vx = s * Math.sin(a); balls[0].vy = -s * Math.cos(a);
    mode = 'play'; banner = null; setPause(); say('');
    beep('tap');
}

/* ---------- physics ---------- */
function step(dt){
    // paddle: keys
    if(keys.l || keys.r) movePaddle(px + ((keys.r ? 1 : 0) - (keys.l ? 1 : 0)) * 420 * dt);
    // paddle width eases to its target
    const target = wideT > 0 ? PW_WIDE : PW;
    if(pw !== target){ pw += Math.sign(target - pw) * Math.min(Math.abs(target - pw), 160 * dt); movePaddle(px); }
    if(banner && (banner.t -= dt) <= 0) banner = null;
    stepBits(dt);
    if(mode === 'ready'){ balls[0].x = px + hold; balls[0].y = PY - R; return; }
    if(mode !== 'play') return;

    if(wideT > 0) wideT = Math.max(0, wideT - dt);
    if(slowT > 0) slowT = Math.max(0, slowT - dt);
    const s = speed();
    for(const b of balls){
        const n = Math.max(1, Math.ceil(s * dt / 3));    // small steps: never jump through a brick
        for(let i = 0; i < n && !b.gone; i++) moveBall(b, s, dt / n);
    }
    balls = balls.filter(b => !b.gone);

    // power-ups fall; the paddle catches them
    for(const d of drops){
        d.y += 110 * dt;
        if(d.y + 6 >= PY && d.y - 6 <= PY + PH && Math.abs(d.x - px) <= pw / 2 + 12){ d.gone = true; power(d.type); }
        else if(d.y - 6 > H) d.gone = true;
    }
    drops = drops.filter(d => !d.gone);

    if(!balls.length) lose();
    else if(!left()) cleared();
}

function moveBall(b, s, h){
    b.x += b.vx * h; b.y += b.vy * h;
    // walls
    if(b.x < R){ b.x = R; b.vx = Math.abs(b.vx); beep('wall'); }
    else if(b.x > W - R){ b.x = W - R; b.vx = -Math.abs(b.vx); beep('wall'); }
    if(b.y < R){ b.y = R; b.vy = Math.abs(b.vy); beep('wall'); }
    if(b.y - R > H){ b.gone = true; return; }
    // paddle: the bounce angle depends on where it hits
    if(b.vy > 0 && b.y + R >= PY && b.y - R <= PY + PH && b.x >= px - pw / 2 - R && b.x <= px + pw / 2 + R){
        const off = Math.max(-1, Math.min(1, (b.x - px) / (pw / 2 + R / 2)));
        const a = off * MAX_ANGLE;
        speedUp = Math.min(speedUp * 1.01, 1.3);
        b.y = PY - R; b.vx = s * Math.sin(a); b.vy = -s * Math.cos(a);
        beep('tap');
        return;
    }
    // bricks: the first one the ball touches
    const c0 = Math.max(0, Math.floor((b.x - R - BX) / (BW + GAP))), c1 = Math.min(COLS - 1, Math.floor((b.x + R - BX) / (BW + GAP)));
    const r0 = Math.max(0, Math.floor((b.y - R - BY) / (BH + GAP))), r1 = Math.min(S.rows - 1, Math.floor((b.y + R - BY) / (BH + GAP)));
    for(let r = r0; r <= r1; r++) for(let c = c0; c <= c1; c++){
        const i = r * COLS + c;
        if(!S.hp[i]) continue;
        const x = BX + c * (BW + GAP), y = BY + r * (BH + GAP);
        const nx = Math.max(x, Math.min(b.x, x + BW)), ny = Math.max(y, Math.min(b.y, y + BH));
        const dx = b.x - nx, dy = b.y - ny;
        if(dx * dx + dy * dy > R * R) continue;
        // bounce off the side it came through, out of the brick
        const inX = b.x > x && b.x < x + BW, inY = b.y > y && b.y < y + BH;
        if(inX || (!inY && Math.abs(dy) >= Math.abs(dx))){
            b.vy = b.y < y + BH / 2 ? -Math.abs(b.vy) : Math.abs(b.vy);
            b.y = b.y < y + BH / 2 ? y - R : y + BH + R;
        }else{
            b.vx = b.x < x + BW / 2 ? -Math.abs(b.vx) : Math.abs(b.vx);
            b.x = b.x < x + BW / 2 ? x - R : x + BW + R;
        }
        // never too flat: keep some vertical speed
        const minVy = s * 0.28;
        if(Math.abs(b.vy) < minVy){
            b.vy = Math.sign(b.vy || 1) * minVy;
            b.vx = Math.sign(b.vx || 1) * Math.sqrt(s * s - minVy * minVy);
        }
        hit(i, r, c, x, y);
        return;
    }
    // keep the speed exact (it changes with slow ball and with paddle hits)
    const v = Math.hypot(b.vx, b.vy) || 1;
    b.vx *= s / v; b.vy *= s / v;
}

function hit(i, r, c, x, y){
    if(S.hp[i] < 0){ beep('steel'); return; }
    S.hp[i]--;
    addScore(10);
    if(S.hp[i] > 0){ beep('hit'); return; }
    beep('break', r);
    const col = ROW_COLORS[r % ROW_COLORS.length];
    for(let k = 0; k < 7; k++){
        bits.push({x: x + Math.random() * BW, y: y + Math.random() * BH, vx: (Math.random() - .5) * 140, vy: -Math.random() * 90, t: 0.5, c: col});
    }
    if(Math.random() < 0.13){
        const t = Math.random();
        drops.push({x: x + BW / 2, y: y + BH / 2, type: t < 0.06 ? 'life' : t < 0.4 ? 'wide' : t < 0.7 ? 'multi' : 'slow'});
    }
}
function stepBits(dt){
    for(const p of bits){ p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.t -= dt; }
    bits = bits.filter(p => p.t > 0);
}

function power(type){
    beep('power');
    banner = {text: POWERS[type].name, t: 1, small: true};
    if(type === 'wide') wideT = 15;
    else if(type === 'slow') slowT = 10;
    else if(type === 'life'){ S.lives++; hud(); }
    else if(type === 'multi'){
        const b = balls[0], s = speed(), a = Math.atan2(b.vx, -b.vy);
        for(const d of [-0.45, 0.45]){
            if(balls.length >= MAX_BALLS) break;
            balls.push({x: b.x, y: b.y, vx: s * Math.sin(a + d), vy: -s * Math.cos(a + d)});
        }
    }
}

function lose(){
    S.lives--;
    hud();
    if(S.lives <= 0) return gameOver();
    beep('lose');
    resetBall();
    banner = {text: 'Mất bóng!', t: 1.2};
    say('Còn ' + S.lives + ' mạng. Chạm để phóng bóng.');
    save();
}
function cleared(){
    const bonus = 100 * S.level;
    addScore(bonus);
    beep('level');
    S.level++;
    startLevel(false);
    say('Qua màn! Thưởng ' + bonus + ' điểm. Chạm để phóng bóng.');
}
function gameOver(){
    mode = 'over'; S.over = true; balls = []; drops = [];
    setPause(); save(); beep('over');
    say('Hết mạng: ván kết thúc với ' + S.score + ' điểm.');
    openDlg('<h2>' + (S.beat ? 'Kỷ lục mới!' : 'Hết ván') + '</h2><p>Bạn được <b>' + S.score + '</b> điểm, tới màn <b>' + S.level + '</b>.</p>'
        + '<div class="acts"><button id="dClose">Đóng</button><button class="pri" id="dNew">Ván mới</button></div>', () => {
        $('dClose').onclick = closeDlg;
        $('dNew').onclick = () => { closeDlg(); newGame(); };
    });
}
function addScore(n){
    S.score += n;
    if(S.score > best()){ store.set(KEY.best, S.score); S.beat = true; }
    hud();
}

/* ---------- drawing ---------- */
const cv = $('field'), ctx = cv.getContext('2d');
let C = {};         // colours from the page's theme tokens
function readColors(){
    const st = getComputedStyle(document.documentElement);
    for(const k of ['field', 'field-line', 'paddle', 'ball', 'steel', 'text', 'muted']) C[k] = st.getPropertyValue('--' + k).trim();
}
function resize(){
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    draw();
}
function rrect(x, y, w, h, rad){
    ctx.beginPath();
    ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();
}
function draw(){
    if(!S) return;
    const k = cv.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // bricks
    for(let r = 0; r < S.rows; r++) for(let c = 0; c < COLS; c++){
        const h = S.hp[r * COLS + c];
        if(!h) continue;
        const x = BX + c * (BW + GAP), y = BY + r * (BH + GAP);
        rrect(x, y, BW, BH, 3);
        if(h < 0){
            const g = ctx.createLinearGradient(x, y, x, y + BH);
            g.addColorStop(0, '#d5d9de'); g.addColorStop(1, C.steel);
            ctx.fillStyle = g; ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,.25)';
            for(const dx of [4, BW - 6]) ctx.fillRect(x + dx, y + BH / 2 - 1, 2, 2);
            continue;
        }
        ctx.fillStyle = ROW_COLORS[r % ROW_COLORS.length]; ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(x + 2, y + 2, BW - 4, 3);   // shine
        if(h > 1){                                                                          // tougher: dark frame, one per extra hit
            ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 2;
            rrect(x + 2, y + 2, BW - 4, BH - 4, 2); ctx.stroke();
            if(h > 2){ rrect(x + 6, y + 5.5, BW - 12, BH - 11, 1); ctx.stroke(); }
        }
    }
    // pieces
    for(const p of bits){ ctx.globalAlpha = Math.max(0, p.t / 0.5); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 3, 3); }
    ctx.globalAlpha = 1;
    // power-ups
    ctx.font = '700 10px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for(const d of drops){
        const P = POWERS[d.type];
        rrect(d.x - 12, d.y - 6, 24, 12, 6); ctx.fillStyle = P.color; ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillText(P.label, d.x, d.y + 0.5);
    }
    // paddle
    rrect(px - pw / 2, PY, pw, PH, 5);
    ctx.fillStyle = C.paddle; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(px - pw / 2 + 5, PY + 2, pw - 10, 2);
    // balls
    ctx.fillStyle = slowT > 0 ? POWERS.slow.color : C.ball;
    for(const b of balls){ ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI * 2); ctx.fill(); }
    // power-up timers along the bottom
    let tx = 8;
    for(const [t, full, type] of [[wideT, 15, 'wide'], [slowT, 10, 'slow']]){
        if(t <= 0) continue;
        ctx.fillStyle = POWERS[type].color;
        ctx.fillRect(tx, H - 8, 60 * t / full, 3);
        tx += 68;
    }
    // text
    const msg = mode === 'pause' ? 'Tạm dừng' : banner ? banner.text : '';
    if(msg){
        ctx.fillStyle = C.text;
        ctx.font = (banner && banner.small && mode !== 'pause' ? '600 18px ' : '700 26px ') + 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
        ctx.fillText(msg, W / 2, H * 0.6);
    }
    if(mode === 'ready' || mode === 'pause'){
        ctx.fillStyle = C.muted;
        ctx.font = '14px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
        ctx.fillText(mode === 'pause' ? 'Chạm để chơi tiếp' : 'Chạm để phóng bóng', W / 2, H * 0.6 + 30);
    }
}

/* ---------- loop: runs only while something moves ---------- */
let last = 0, raf = 0;
function frame(t){
    raf = 0;
    if(window.gameMenuOpen && gameMenuOpen() && mode === 'play') pause();
    const dt = Math.min((t - last) / 1000, 1 / 30);
    last = t;
    step(dt);
    draw();
    if(mode === 'play' || mode === 'ready' || bits.length) raf = requestAnimationFrame(frame);
}
function run(){ if(!raf){ last = performance.now(); raf = requestAnimationFrame(frame); } }

function pause(){ if(mode !== 'play') return; mode = 'pause'; setPause(); save(); draw(); }
function resume(){ if(mode !== 'pause') return; unlockAudio(); mode = 'play'; setPause(); run(); }
function setPause(){
    const b = $('pauseBtn');
    b.disabled = mode !== 'play' && mode !== 'pause';
    b.textContent = mode === 'pause' ? 'Chơi tiếp' : 'Tạm dừng';
    run();
}

/* ---------- input ---------- */
function movePaddle(x){ px = Math.max(pw / 2, Math.min(W - pw / 2, x)); }
function fieldX(e){ const r = cv.getBoundingClientRect(); return (e.clientX - r.left) * W / r.width; }
let drag = null;    // touch/pen: the paddle follows the finger's movement, from wherever it lands
for(const el of [cv, $('msg')]){   // the field and the strip under it
    el.addEventListener('pointerdown', e => {
        unlockAudio();
        drag = {id: e.pointerId, x: fieldX(e), px, t: performance.now(), moved: 0};
        if(e.pointerType === 'mouse') movePaddle(fieldX(e));
        try{ el.setPointerCapture(e.pointerId); }catch(err){}
    });
    el.addEventListener('pointermove', e => {
        if(e.pointerType === 'mouse'){ movePaddle(fieldX(e)); if(drag) drag.moved = 99; }
        else if(drag && e.pointerId === drag.id){
            const x = fieldX(e);
            drag.moved = Math.max(drag.moved, Math.abs(x - drag.x));
            movePaddle(drag.px + (x - drag.x) * 1.15);
        }else return;
        if(mode !== 'play') draw();
    });
    el.addEventListener('pointerup', e => {
        if(!drag || e.pointerId !== drag.id) return;
        const tap = e.pointerType === 'mouse' || (drag.moved < 8 && performance.now() - drag.t < 350);
        drag = null;
        if(!tap) return;
        if(mode === 'ready') launch();
        else if(mode === 'pause') resume();
    });
    el.addEventListener('pointercancel', () => { drag = null; });
}

const keys = {l: false, r: false};
document.addEventListener('keydown', e => {
    if(window.gameMenuOpen && gameMenuOpen()) return;
    if(!$('dlg').hidden){ if(e.key === 'Escape') closeDlg(); return; }
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.key === 'ArrowLeft' || e.key === 'a'){ keys.l = true; run(); e.preventDefault(); }
    else if(e.key === 'ArrowRight' || e.key === 'd'){ keys.r = true; run(); e.preventDefault(); }
    else if(e.key === ' ' || e.key === 'ArrowUp'){
        e.preventDefault();
        if(mode === 'ready') launch(); else if(mode === 'play') pause(); else if(mode === 'pause') resume();
    }
    else if(e.key === 'p' || e.key === 'P' || e.key === 'Escape'){ if(mode === 'play') pause(); else if(mode === 'pause') resume(); }
});
document.addEventListener('keyup', e => {
    if(e.key === 'ArrowLeft' || e.key === 'a') keys.l = false;
    if(e.key === 'ArrowRight' || e.key === 'd') keys.r = false;
});
window.addEventListener('blur', () => { keys.l = keys.r = false; pause(); });
document.addEventListener('visibilitychange', () => { if(document.hidden){ pause(); if(S) save(); } });

$('newBtn').onclick = () => {
    if(S.over || (S.score === 0 && S.level === 1)) return newGame();
    pause();
    confirmBox('Ván mới?', 'Ván đang chơi (' + S.score + ' điểm, màn ' + S.level + ') sẽ bị bỏ.', 'Ván mới', newGame);
};
$('pauseBtn').onclick = () => { if(mode === 'play') pause(); else resume(); };
$('soundBtn').onclick = () => { soundOn = !soundOn; store.set(KEY.sound, soundOn); setSoundIcon(); unlockAudio(); beep('tap'); };
$('helpBtn').onclick = () => { pause(); openDlg('<h2>Luật chơi</h2><ul class="rules">'
    + '<li>Kéo ngón tay ở bất kỳ đâu trên sân để di chuyển thanh đỡ (máy tính: chuột hoặc phím mũi tên). Chạm vào sân (hoặc phím cách) để phóng bóng.</li>'
    + '<li>Bóng nảy theo chỗ chạm thanh đỡ: chạm gần mép thì bay xiên hơn.</li>'
    + '<li>Phá hết gạch để qua màn, được thưởng 100 × số màn. Mỗi lần trúng gạch được 10 điểm.</li>'
    + '<li>Gạch có viền tối cần 2–3 lần trúng. Gạch thép xám không vỡ. Càng lên màn cao bóng càng nhanh.</li>'
    + '<li>Đỡ lấy viên rơi xuống: <span class="pu" style="background:' + POWERS.wide.color + '">W</span> thanh đỡ dài, '
    + '<span class="pu" style="background:' + POWERS.multi.color + '">3</span> ba bóng, '
    + '<span class="pu" style="background:' + POWERS.slow.color + '">S</span> bóng chậm, '
    + '<span class="pu" style="background:' + POWERS.life.color + '">+</span> thêm mạng.</li>'
    + '<li>Rơi hết bóng là mất một mạng; hết 3 mạng là hết ván. Phím P tạm dừng. Ván đang chơi tự lưu trên máy này.</li>'
    + '</ul><div class="acts"><button class="pri" id="dClose">Đã hiểu</button></div>', () => { $('dClose').onclick = closeDlg; }); };

/* speaker icon drawn as SVG (emoji fonts are missing on some devices) */
function setSoundIcon(){
    const b = $('soundBtn');
    b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>'
        + (soundOn ? '<path d="M16.5 8.5a5 5 0 0 1 0 7M19.5 5.5a9 9 0 0 1 0 13"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>') + '</svg>';
    b.title = soundOn ? 'Tắt âm thanh' : 'Bật âm thanh';
    b.setAttribute('aria-pressed', String(!soundOn));
}

function best(){ return +store.get(KEY.best) || 0; }
function hud(){
    $('score').textContent = S.score; $('level').textContent = S.level;
    $('lives').textContent = S.lives; $('best').textContent = Math.max(best(), S.score);
}
function say(t){ $('msg').textContent = t || ''; }
function save(){ if(S) store.set(KEY.game, {level: S.level, score: S.score, lives: S.lives, rows: S.rows, hp: S.hp, over: S.over, beat: S.beat}); }

function openDlg(html, init){ $('dlgBox').innerHTML = html; $('dlg').hidden = false; init && init(); }
function closeDlg(){ $('dlg').hidden = true; $('dlgBox').innerHTML = ''; }
function confirmBox(title, text, okText, ok){
    openDlg('<h2>' + title + '</h2><p>' + text + '</p><div class="acts"><button id="dNo">Hủy</button><button class="pri" id="dYes">' + okText + '</button></div>', () => {
        $('dNo').onclick = closeDlg;
        $('dYes').onclick = () => { closeDlg(); ok(); };
    });
}
$('dlg').addEventListener('click', e => { if(e.target === $('dlg')) closeDlg(); });

/* ---------- sound (made in code, no files) ---------- */
let ac = null;
function unlockAudio(){
    if(!soundOn) return;
    try{
        if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        if(ac.state === 'suspended') ac.resume();
    }catch(e){ ac = null; }
}
function tone(freq, dur, type, vol, when, slide){
    const t = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
}
function beep(kind, row){
    if(!soundOn || !ac) return;
    try{
        switch(kind){
            case 'tap':   tone(330, 0.05, 'triangle', 0.12); break;
            case 'wall':  tone(220, 0.03, 'sine', 0.05); break;
            case 'hit':   tone(500, 0.05, 'square', 0.05); break;
            case 'steel': tone(1200, 0.06, 'triangle', 0.06); break;
            case 'break': tone(880 - (row || 0) * 50, 0.08, 'triangle', 0.1); break;
            case 'power': [523, 784, 1047].forEach((f, k) => tone(f, 0.1, 'triangle', 0.1, k * 0.05)); break;
            case 'lose':  tone(300, 0.35, 'sawtooth', 0.07, 0, 90); break;
            case 'level': [523, 659, 784, 1047].forEach((f, k) => tone(f, 0.12, 'triangle', 0.12, k * 0.07)); break;
            case 'over':  [392, 330, 262].forEach((f, k) => tone(f, 0.25, 'sine', 0.14, k * 0.18)); break;
        }
    }catch(e){}
}

/* ---------- start ---------- */
setSoundIcon();
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); draw(); });
new ResizeObserver(resize).observe(cv);
const saved = store.get(KEY.game);
const ok = saved && Number.isInteger(saved.level) && saved.level >= 1 && Number.isInteger(saved.rows) && saved.rows >= 1 && saved.rows <= 9
    && Array.isArray(saved.hp) && saved.hp.length === saved.rows * COLS && saved.hp.every(h => Number.isInteger(h) && h >= -1 && h <= 3)
    && Number.isFinite(saved.score) && Number.isInteger(saved.lives) && saved.lives > 0;
if(ok && !saved.over){
    S = {level: saved.level, score: saved.score, lives: saved.lives, rows: saved.rows, hp: saved.hp, over: false, beat: !!saved.beat};
    if(!left()) Object.assign(S, layout(S.level));
    resetBall(); hud();
    say('Tiếp tục ván đang chơi. Chạm để phóng bóng.');
}else{
    newGame();
    if(!best()) setTimeout(() => $('helpBtn').click(), 50);
}
</script>

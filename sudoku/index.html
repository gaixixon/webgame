<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Sudoku: điền số 1–9 để mỗi hàng, cột và ô 3×3 có đủ 1–9.">
<title>Sudoku</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%231f6feb'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'%3E9%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Games">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1218" media="(prefers-color-scheme: dark)">
<style>
/* Classic white and blue (like "Sudoku Offline"): white board, thin grey lines,
   black box lines, dark grey givens, blue entries, light-blue highlights, a
   finished row/column/box flashes yellow; red only for a repeated number */
:root{
    --page:#ffffff; --text:#282e34; --muted:#6b7178; --line:#e2e6ea;
    --panel:#ffffff; --glass:#ffffff; --glass-line:#e2e6ea;
    --cell:#ffffff; --box-alt:#ffffff; --grid:#a0a0a0; --frame:#000000;   /* thin lines; box lines and border */
    --given:#282e34; --user:#0960db; --note:#555a5f;
    --peer:#cde7fe; --same:#b8deff; --sel:#7fc4ff;
    --accent:#0960db; --accent2:#0960db; --tool:#454442; --danger:#e53935; --bad-bg:#fdd9d9; --flash:#fec92b;
    --pad-text:#494846;
    --btn:#ffffff; --btn-hover:#eef6ff; --bg:#f1f6fb;
    --grad:linear-gradient(90deg,#43bae4,#49cbfa);     /* sky-blue band: white text on it */
    --shadow:0 1px 3px rgba(0,0,0,.1); --shadow-lg:0 2px 8px rgba(0,0,0,.1);
}
@media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
        --page:#0e1218; --text:#e6edf3; --muted:#8b949e; --line:#283039;
        --panel:#161b22; --glass:#161b22; --glass-line:#283039;
        --cell:#161b22; --box-alt:#161b22; --grid:#3d4651; --frame:#d0d7de;
        --given:#e6edf3; --user:#5aa9ff; --note:#9aa4ae;
        --peer:#1b2e45; --same:#22436b; --sel:#2d6cb0;
        --accent:#5aa9ff; --accent2:#5aa9ff; --tool:#b4bcc4; --danger:#ff6b6b; --bad-bg:#4a1c1c; --flash:#9a7614;
        --pad-text:#d0d7de;
        --btn:#161b22; --btn-hover:#1f2a36; --bg:#1f2731;
        --grad:linear-gradient(90deg,#43bae4,#49cbfa);
        --shadow:0 1px 3px rgba(0,0,0,.5); --shadow-lg:0 2px 8px rgba(0,0,0,.5);
    }
}
:root[data-theme="dark"]{
    --page:#0e1218; --text:#e6edf3; --muted:#8b949e; --line:#283039;
    --panel:#161b22; --glass:#161b22; --glass-line:#283039;
    --cell:#161b22; --box-alt:#161b22; --grid:#3d4651; --frame:#d0d7de;
    --given:#e6edf3; --user:#5aa9ff; --note:#9aa4ae;
    --peer:#1b2e45; --same:#22436b; --sel:#2d6cb0;
    --accent:#5aa9ff; --accent2:#5aa9ff; --tool:#b4bcc4; --danger:#ff6b6b; --bad-bg:#4a1c1c; --flash:#9a7614;
    --pad-text:#d0d7de;
    --btn:#161b22; --btn-hover:#1f2a36; --bg:#1f2731;
    --grad:linear-gradient(90deg,#43bae4,#49cbfa);
    --shadow:0 1px 3px rgba(0,0,0,.5); --shadow-lg:0 2px 8px rgba(0,0,0,.5);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; background:var(--page); }
body{ background:var(--page); color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      padding:12px 16px 24px; min-height:100vh; -webkit-tap-highlight-color:transparent; }
.wrap{ width:100%; max-width:480px; margin:0 auto; }

/* header: level badge, timer, puzzles solved; then the progress bar */
.top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.badge{ display:flex; align-items:baseline; gap:6px; padding:7px 14px; border-radius:999px; color:#fff; font-weight:800;
        background:var(--grad); box-shadow:var(--shadow); }
.badge .k{ font-size:12px; font-weight:600; opacity:.9; text-transform:uppercase; letter-spacing:.05em; }
.badge #level{ font-size:20px; line-height:1; font-variant-numeric:tabular-nums; }
.chip{ display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; background:var(--glass); border:1px solid var(--glass-line);
       box-shadow:var(--shadow); font-weight:700; font-variant-numeric:tabular-nums; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.chip svg{ width:16px; height:16px; flex:none; }
.chip.time{ margin-left:auto; font-size:17px; }
.chip.time svg{ color:var(--accent2); }
.chip.won{ font-size:15px; }
.chip.won svg{ color:var(--accent); }
.chip.won small{ font-weight:500; color:var(--muted); font-size:12px; }
.progress{ height:8px; border-radius:999px; background:var(--glass); border:1px solid var(--glass-line); overflow:hidden; margin-bottom:10px; }
.progress div{ height:100%; width:0; border-radius:999px; background:var(--accent); transition:width .35s ease; }

/* board: a raised card; thin light lines inside the boxes, coloured lines between them */
.board{ display:grid; grid-template-columns:repeat(9,1fr); width:100%; aspect-ratio:1; padding:2px;
        background:var(--frame); border-radius:4px; box-shadow:var(--shadow-lg); user-select:none; -webkit-user-select:none; touch-action:manipulation; overflow:hidden; }
.cell{ position:relative; background:var(--cell); display:flex; align-items:center; justify-content:center; cursor:pointer;
       box-shadow:inset 0 0 0 .5px var(--grid); font-size:min(6.2vw, 28px); font-weight:400; font-variant-numeric:tabular-nums; color:var(--user);
       transition:background-color .15s; }
.cell.alt{ background:var(--box-alt); }
.cell.bt{ margin-top:2px; }                 /* the lines between 3x3 boxes: the navy frame showing through */
.cell.bl{ margin-left:2px; }
.cell.given{ color:var(--given); font-weight:400; }
.cell.peer{ background:var(--peer); }
.cell.same{ background:var(--same); }
.cell.sel{ background:var(--sel); }
/* a number repeated in its row, column or box: both squares red */
.cell.bad{ background:var(--bad-bg); }
.cell.bad:not(.given){ color:var(--danger); }
.cell.shake{ animation:shake .35s ease; }
@keyframes shake{ 20%{ transform:translateX(-4px); } 40%{ transform:translateX(4px); } 60%{ transform:translateX(-3px); } 80%{ transform:translateX(2px); } }
.cell .notes{ position:absolute; inset:2px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
              font-size:min(2.7vw, 12px); line-height:1; color:var(--note); font-weight:500; }
.cell .notes span{ display:flex; align-items:center; justify-content:center; }
.cell .notes span.hl{ color:var(--accent); font-weight:800; }
.cell.flash{ animation:flash .7s ease; }
@keyframes flash{ 30%{ background:var(--flash); } }
.cell.win{ animation:win .6s ease both; }
@keyframes win{ 50%{ background:var(--flash); transform:scale(.88); } }
.cell.placed{ animation:placed .22s ease-out; }
@keyframes placed{ from{ transform:scale(.6); } to{ transform:scale(1); } }

/* number pad: round buttons that press down; a number all placed gets a ✓ */
.pad{ display:grid; grid-template-columns:repeat(9,1fr); gap:5px; margin-top:14px; }
/* number pad: big flat blue digits; a number all placed fades, with a ✓ */
.pad button{ padding:4px 0 2px; border:0; border-radius:8px; background:transparent; box-shadow:none; font-size:34px; font-weight:300; line-height:1.05;
             color:var(--pad-text); display:flex; flex-direction:column; align-items:center; transition:transform .06s, background-color .1s; }
.pad button:hover{ background:var(--btn-hover); }
.pad button:active:not(:disabled){ transform:scale(.92); background:var(--peer); }
.pad button small{ font-size:11px; font-weight:600; color:var(--muted); }
.pad button.used{ opacity:.25; }
.tools{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
.tools button{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px; font-weight:600; padding:8px 4px; border-radius:12px; }
.tools button svg{ width:22px; height:22px; }
.tools button{ border:0; box-shadow:none; background:transparent; color:var(--tool); }
.tools button:hover{ background:var(--btn-hover); }
.tools button svg{ color:var(--tool); }
.tools button.on{ color:var(--accent); background:var(--peer); }
.tools button.on svg{ color:var(--accent); }
.bar{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.bar button{ flex:1 1 auto; border-radius:999px; }
button{ font:inherit; font-size:14px; color:var(--text); background:var(--btn); border:1px solid var(--line); border-radius:10px;
        padding:9px 12px; cursor:pointer; box-shadow:var(--shadow); white-space:nowrap; }
button:hover{ background:var(--btn-hover); }
button:disabled{ opacity:.45; cursor:default; }
button.icon{ flex:0 0 auto; width:42px; padding:9px 0; }
#msg{ min-height:20px; text-align:center; color:var(--muted); font-size:14px; margin-top:10px; }

/* phones: the board almost edge to edge (2px each side, clear of the notch in landscape) */
@media (max-width:520px){
    .board{ width:calc(100vw - 4px - env(safe-area-inset-left) - env(safe-area-inset-right));
            margin-left:calc(50% - 50vw + 2px + env(safe-area-inset-left)); border-radius:10px; }
}

/* confetti when a puzzle is solved */
#confetti{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:40; }

/* dialogs */
.dlg{ position:fixed; inset:0; background:rgba(20,30,50,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:30; }
.dlg[hidden]{ display:none; }
.box{ background:var(--panel); color:var(--text); border-radius:18px; padding:18px; width:100%; max-width:360px; box-shadow:0 20px 50px rgba(0,0,0,.35); overflow:hidden; }
.box h2{ font-size:19px; margin-bottom:10px; }
.box p{ color:var(--muted); font-size:14px; line-height:1.45; margin-bottom:10px; }
.box .acts{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
.box button{ border-radius:999px; }
.box button.pri{ background:var(--grad); color:#fff; border-color:transparent; }
.box .band{ margin:-18px -18px 14px; padding:18px; color:#fff; background:var(--grad); }
.box .band h2{ margin:0 0 2px; font-size:21px; }
.box .band p{ color:#fff; opacity:.85; margin:0; }
.box .big{ display:flex; gap:10px; margin-bottom:12px; }
.box .big div{ flex:1; background:var(--bg); border-radius:12px; padding:8px 10px; }
.box .big b{ display:block; font-size:20px; font-variant-numeric:tabular-nums; }
.box .big span{ font-size:12px; color:var(--muted); }
table.hs{ width:100%; border-collapse:collapse; font-size:14px; margin-bottom:12px; font-variant-numeric:tabular-nums; }
table.hs td{ padding:6px 4px; border-bottom:1px solid var(--line); }
table.hs td.s{ text-align:right; font-weight:700; color:var(--accent2); }
table.hs td.d{ text-align:right; color:var(--muted); font-size:12px; }
.rules{ font-size:14px; line-height:1.5; padding-left:18px; margin-bottom:12px; }
.rules li{ margin-bottom:4px; }
@media (prefers-reduced-motion: reduce){ .cell, .pad button, .progress div{ transition:none; } .cell.flash, .cell.win, .cell.placed, .cell.shake{ animation:none; } }
</style>
</head>
<body>
<script src="../menu.js" data-game="sudoku"></script>
<div class="wrap">
    <div class="top">
        <div class="badge" title="Cấp hiện tại"><span class="k">Cấp</span><span id="level">1</span></div>
        <div class="chip time" title="Thời gian"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span id="time">00:00</span></div>
        <div class="chip won" title="Số câu đã giải"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg><span id="solved">0</span><small>đã giải</small></div>
    </div>
    <div class="progress" title="Đã điền"><div id="prog"></div></div>

    <div class="board" id="board" role="grid" aria-label="Bảng Sudoku 9×9"></div>

    <div class="pad" id="pad" aria-label="Bàn số"></div>
    <div class="tools">
        <button id="undoBtn" title="Đi lại (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Đi lại</button>
        <button id="eraseBtn" title="Xóa ô (Delete)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20H8l-5-5 10-10 8 8-6 6"/><path d="M8 11l6 6"/></svg>Xóa</button>
        <button id="notesBtn" title="Ghi chú (N)" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span id="notesTxt">Ghi chú: tắt</span></button>
        <button id="hintBtn" title="Gợi ý: điền đúng một ô"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>Gợi ý</button>
    </div>

    <div id="msg"></div>

    <div class="bar">
        <button id="newBtn" title="Một câu đố khác cùng cấp">Câu khác</button>
        <button id="restartBtn" title="Chơi lại câu đố này từ đầu">Chơi lại</button>
        <button id="hsBtn">Thành tích</button>
        <button id="helpBtn" class="icon" title="Luật chơi" aria-label="Luật chơi">?</button>
    </div>
</div>

<div class="dlg" id="dlg" hidden><div class="box" id="dlgBox" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
/* =========================================================
   Sudoku: every row, column and 3x3 box holds 1-9 once.
   Each puzzle is made here and has exactly one solution.
   Only clear mistakes are shown while playing (a number repeated in its
   row, column or box turns red); when the board is full the game says
   whether it is right, not where a legal but wrong number is.
   No difficulty to choose: play starts at level 1 (easy) and each solved
   puzzle moves up one level, with one number fewer given, down to
   MIN_GIVENS (as few as a unique solution allows).
   Saved in this browser only (localStorage): the game in progress and the
   progress (level, puzzles solved, highest level).
   ========================================================= */
const FIRST_GIVENS = 42, MIN_GIVENS = 24;
const givensFor = level => Math.max(MIN_GIVENS, FIRST_GIVENS + 1 - level);
const KEY = {game: 'sudoku.game', progress: 'sudoku.progress'};
const UNDO_MAX = 200;

const $ = id => document.getElementById(id);
const store = {
    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
    del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------- squares: row, column, box and the 20 peers of each ---------- */
const ROW = i => Math.floor(i / 9), COL = i => i % 9, BOX = i => Math.floor(ROW(i) / 3) * 3 + Math.floor(COL(i) / 3);
const PEERS = [];
for(let i = 0; i < 81; i++){
    const p = [];
    for(let j = 0; j < 81; j++) if(j !== i && (ROW(j) === ROW(i) || COL(j) === COL(i) || BOX(j) === BOX(i))) p.push(j);
    PEERS.push(p);
}

/* ---------- solver (bit masks, fewest candidates first) ---------- */
const BITS = [];                      // mask -> list of digits
for(let m = 0; m < 512; m++){ const d = []; for(let k = 0; k < 9; k++) if(m & (1 << k)) d.push(k + 1); BITS.push(d); }

function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* number of solutions of g (stops at limit); with fill, the first solution
   is written into g, trying digits in random order */
function solve(g, limit, fill){
    const rows = new Array(9).fill(0), cols = new Array(9).fill(0), boxes = new Array(9).fill(0);
    for(let i = 0; i < 81; i++){
        const v = g[i];
        if(!v) continue;
        const b = 1 << (v - 1);
        if((rows[ROW(i)] | cols[COL(i)] | boxes[BOX(i)]) & b) return 0;   // a clash: no solution
        rows[ROW(i)] |= b; cols[COL(i)] |= b; boxes[BOX(i)] |= b;
    }
    let count = 0;
    const work = g.slice();
    (function rec(){
        let best = -1, bestMask = 0, bestN = 10;
        for(let i = 0; i < 81; i++){
            if(work[i]) continue;
            const mask = ~(rows[ROW(i)] | cols[COL(i)] | boxes[BOX(i)]) & 511;
            const n = BITS[mask].length;
            if(n < bestN){ best = i; bestMask = mask; bestN = n; if(n < 2) break; }
        }
        if(best < 0){
            count++;
            if(fill && count === 1) for(let i = 0; i < 81; i++) g[i] = work[i];
            return;
        }
        if(!bestN) return;
        const digits = fill ? shuffle(BITS[bestMask].slice()) : BITS[bestMask];
        const r = ROW(best), c = COL(best), x = BOX(best);
        for(const d of digits){
            const b = 1 << (d - 1);
            work[best] = d; rows[r] |= b; cols[c] |= b; boxes[x] |= b;
            rec();
            work[best] = 0; rows[r] &= ~b; cols[c] &= ~b; boxes[x] &= ~b;
            if(count >= limit) return;
        }
    })();
    return count;
}

/* a puzzle with exactly one solution: a random full grid, then squares
   emptied in random order while the solution stays unique */
function makePuzzle(level){
    const target = givensFor(level);
    let best = null;
    for(let attempt = 0; attempt < (target <= 26 ? 4 : 1); attempt++){
        const sol = new Array(81).fill(0);
        solve(sol, 1, true);
        const puz = sol.slice();
        let givens = 81;
        for(const i of shuffle([...Array(81).keys()])){
            if(givens <= target) break;
            const keep = puz[i];
            puz[i] = 0;
            if(solve(puz, 2, false) !== 1) puz[i] = keep;
            else givens--;
        }
        if(!best || givens < best.givens) best = {puz, sol, givens};
        if(givens <= target) break;
    }
    return best;
}

/* ---------- state ---------- */
let S;              // {level, givens[81], sol[81], v[81], notes[81] (bit masks), time, done, hints}
function progress(){ const p = store.get(KEY.progress); return p && Number.isInteger(p.level) && p.level >= 1 ? p : {level: 1, solved: 0, top: 1}; }
let sel = -1;
let notesMode = false;
let undoStack = [];

function newGame(level){
    say('Đang tạo câu đố…');
    setTimeout(() => {                                // let the message paint first
        const p = makePuzzle(level);
        S = {level, givens: p.puz, sol: p.sol, v: p.puz.slice(), notes: new Array(81).fill(0), time: 0, done: false, hints: 0};
        sel = -1; undoStack = [];
        save(); render();
        say('Cấp ' + level + ': ' + p.givens + ' số cho sẵn.');
    }, 30);
}

/* ---------- moves ---------- */
function snapshot(){ undoStack.push({v: S.v.slice(), notes: S.notes.slice()}); if(undoStack.length > UNDO_MAX) undoStack.shift(); }
const editable = i => i >= 0 && !S.givens[i] && !S.done;

function enter(d){
    if(!editable(sel)) return;
    const i = sel;
    if(notesMode){
        if(S.v[i]) return say('Ô đã có số: xóa số trước khi ghi chú.');
        snapshot();
        S.notes[i] ^= 1 << (d - 1);
    }else{
        snapshot();
        if(S.v[i] === d){ S.v[i] = 0; }
        else{
            S.v[i] = d;
            S.notes[i] = 0;
            for(const j of PEERS[i]) S.notes[j] &= ~(1 << (d - 1));   // that digit can't be a candidate around it
            justFilled = i;
        }
    }
    after();
}

function erase(){
    if(!editable(sel)) return;
    if(!S.v[sel] && !S.notes[sel]) return;
    snapshot();
    S.v[sel] = 0; S.notes[sel] = 0;
    after();
}

function undo(){
    if(!undoStack.length || S.done) return;
    const u = undoStack.pop();
    S.v = u.v; S.notes = u.notes;
    save(); render(); say('');
}

/* one correct square: the selected one if it is empty or wrong, else a random empty one */
function hint(){
    if(S.done) return;
    let i = editable(sel) && S.v[sel] !== S.sol[sel] ? sel : -1;
    if(i < 0){
        const empty = [];
        for(let j = 0; j < 81; j++) if(!S.v[j]) empty.push(j);
        if(!empty.length) for(let j = 0; j < 81; j++) if(S.v[j] !== S.sol[j]) empty.push(j);
        if(!empty.length) return;
        i = empty[Math.floor(Math.random() * empty.length)];
    }
    snapshot();
    const d = S.sol[i];
    S.v[i] = d; S.notes[i] = 0;
    for(const j of PEERS[i]) S.notes[j] &= ~(1 << (d - 1));
    S.hints++;
    sel = i;
    justFilled = i;
    after();
    if(!S.done) say('Gợi ý: ' + d + ' ở hàng ' + (ROW(i) + 1) + ', cột ' + (COL(i) + 1) + '.');
}

function after(){
    say('');
    const i = justFilled;
    justFilled = -1;
    if(S.v.every(x => x)){
        if(S.v.every((x, j) => x === S.sol[j])) return win();
        say('Bảng đã đầy nhưng chưa đúng. Hãy kiểm tra lại.');
    }
    save(); render();
    if(i >= 0) celebrate(i);
}

/* squares whose number is repeated in their row, column or box (clear
   mistakes only: a legal but wrong number is not shown) */
function clashes(){
    const bad = new Set();
    for(let i = 0; i < 81; i++){
        const v = S.v[i];
        if(v) for(const j of PEERS[i]) if(S.v[j] === v){ bad.add(i); break; }
    }
    return bad;
}

/* the square just filled pops in (or shakes when it clashes); a row, column
   or box it completes without a clash flashes */
let justFilled = -1;
function celebrate(i){
    const pop = (c, cls) => { c.classList.remove(cls); void c.offsetWidth; c.classList.add(cls); setTimeout(() => c.classList.remove(cls), 750); };
    const bad = clashes();
    if(bad.has(i)) return pop(cells[i], 'shake');
    pop(cells[i], 'placed');
    const units = [[], [], []];
    for(let j = 0; j < 81; j++){
        if(ROW(j) === ROW(i)) units[0].push(j);
        if(COL(j) === COL(i)) units[1].push(j);
        if(BOX(j) === BOX(i)) units[2].push(j);
    }
    for(const u of units) if(u.every(j => S.v[j] && !bad.has(j))) u.forEach((j, k) => setTimeout(() => pop(cells[j], 'flash'), k * 25));
}

function win(){
    S.done = true;
    sel = -1;
    const t = Math.floor(S.time);
    // up one level (a puzzle solved again at an older level counts, but doesn't go back)
    const p = progress();
    p.solved = (p.solved || 0) + 1;
    p.level = Math.max(p.level, S.level + 1);
    p.top = Math.max(p.top || 1, p.level);
    store.set(KEY.progress, p);
    save(); render();
    // a ripple across the board
    document.querySelectorAll('.cell').forEach((c, i) => { c.style.animationDelay = ((ROW(i) + COL(i)) * 35) + 'ms'; c.classList.add('win'); });
    say('Hoàn thành!');
    confetti();
    const harder = givensFor(p.level) < givensFor(S.level);
    setTimeout(() => openDlg('<div class="band"><h2>Hoàn thành cấp ' + S.level + '!</h2><p>Tuyệt vời, bạn đã giải ' + p.solved + ' câu.</p></div>'
        + '<div class="big"><div><b>' + fmt(t) + '</b><span>thời gian</span></div><div><b>' + S.hints + '</b><span>gợi ý đã dùng</span></div></div>'
        + '<p>Tiếp theo: <b>cấp ' + p.level + '</b>' + (harder ? ', khó hơn một chút (' + givensFor(p.level) + ' số cho sẵn).' : ' (' + givensFor(p.level) + ' số cho sẵn).') + '</p>'
        + '<div class="acts"><button id="dClose">Đóng</button><button class="pri" id="dNew">Câu tiếp theo</button></div>', () => {
        $('dClose').onclick = closeDlg;
        $('dNew').onclick = () => { closeDlg(); newGame(progress().level); };
    }), 900);
}

/* confetti over the page for ~2.5 s (none with reduced motion) */
function confetti(){
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = document.createElement('canvas');
    cv.id = 'confetti';
    document.body.appendChild(cv);
    const dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    const colors = ['#0960db', '#43bae4', '#7fc4ff', '#b8deff', '#fec92b', '#ffffff'];
    const parts = Array.from({length: 160}, () => ({
        x: W / 2 + (Math.random() - .5) * W * .3, y: H * .45, vx: (Math.random() - .5) * 13, vy: -6 - Math.random() * 11,
        w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
        c: colors[Math.floor(Math.random() * colors.length)]
    }));
    const t0 = performance.now();
    (function frame(now){
        const t = now - t0;
        ctx.clearRect(0, 0, W, H);
        ctx.globalAlpha = t > 1800 ? Math.max(0, 1 - (t - 1800) / 700) : 1;
        for(const q of parts){
            q.vy += .32; q.vx *= .99; q.x += q.vx; q.y += q.vy; q.r += q.vr;
            ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); ctx.restore();
        }
        if(t < 2500) requestAnimationFrame(frame); else cv.remove();
    })(t0);
}

/* ---------- drawing ---------- */
const board = $('board'), cells = [];
for(let i = 0; i < 81; i++){
    const d = document.createElement('div');
    d.className = 'cell';
    d.setAttribute('role', 'gridcell');
    d.addEventListener('click', () => { if(S && !S.done){ sel = sel === i ? -1 : i; render(); } });
    board.appendChild(d);
    cells.push(d);
}
const pad = $('pad'), padBtns = [];
for(let d = 1; d <= 9; d++){
    const b = document.createElement('button');
    b.innerHTML = '<span>' + d + '</span><small></small>';
    b.setAttribute('aria-label', 'Số ' + d);
    b.addEventListener('click', () => enter(d));
    pad.appendChild(b);
    padBtns.push(b);
}

function render(){
    const sv = sel >= 0 ? S.v[sel] : 0;
    const bad = clashes();
    const count = new Array(10).fill(0);
    for(let i = 0; i < 81; i++){
        const c = cells[i], v = S.v[i];
        count[v]++;
        let cls = 'cell' + (BOX(i) % 2 ? ' alt' : '');
        if(ROW(i) % 3 === 0 && ROW(i)) cls += ' bt';
        if(COL(i) % 3 === 0 && COL(i)) cls += ' bl';
        if(S.givens[i]) cls += ' given';
        if(i === sel) cls += ' sel';
        else if(sv && v === sv) cls += ' same';
        else if(sel >= 0 && (ROW(i) === ROW(sel) || COL(i) === COL(sel) || BOX(i) === BOX(sel))) cls += ' peer';
        if(bad.has(i)) cls += ' bad';
        const anim = (c.className.match(/ (win|flash|placed|shake)/g) || []).join('');
        if(c.className.replace(/ (win|flash|placed|shake)/g, '') !== cls){ c.className = cls + anim; if(!anim) c.style.animationDelay = ''; }
        const key = v ? 'v' + v : S.notes[i] ? 'n' + S.notes[i] + '/' + sv : '';
        if(c.dataset.k === key) continue;
        c.dataset.k = key;
        if(v){ c.textContent = v; }
        else if(S.notes[i]){
            let h = '<div class="notes">';
            for(let d = 1; d <= 9; d++) h += '<span' + (d === sv ? ' class="hl"' : '') + '>' + (S.notes[i] & (1 << (d - 1)) ? d : '') + '</span>';
            c.innerHTML = h + '</div>';
        }else c.textContent = '';
        c.setAttribute('aria-label', 'Hàng ' + (ROW(i) + 1) + ', cột ' + (COL(i) + 1) + (v ? ': ' + v : ': trống'));
    }
    padBtns.forEach((b, k) => {
        const left = Math.max(0, 9 - count[k + 1]);
        b.querySelector('small').textContent = left ? left : '✓';
        b.classList.toggle('used', !left);
        b.disabled = S.done;
    });
    $('level').textContent = S.level;
    const toFill = S.givens.filter(x => !x).length, filled = S.v.filter((x, i) => x && !S.givens[i]).length;
    $('prog').style.width = (toFill ? filled / toFill * 100 : 100) + '%';
    $('solved').textContent = progress().solved || 0;
    $('undoBtn').disabled = !undoStack.length || S.done;
    $('eraseBtn').disabled = $('hintBtn').disabled = S.done;
    $('notesBtn').classList.toggle('on', notesMode);
    $('notesBtn').setAttribute('aria-pressed', String(notesMode));
    $('notesTxt').textContent = 'Ghi chú: ' + (notesMode ? 'bật' : 'tắt');
    showTime();
}

function say(t){ $('msg').textContent = t || ''; }
function fmt(t){ t = Math.floor(t); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60, p = n => String(n).padStart(2, '0'); return (h ? h + ':' + p(m) : p(m)) + ':' + p(s); }
function showTime(){ $('time').textContent = fmt(S.time); }
function when(t){ const d = new Date(t), p = n => String(n).padStart(2, '0'); return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear(); }

/* ---------- buttons and keys ---------- */
$('undoBtn').onclick = undo;
$('eraseBtn').onclick = erase;
$('hintBtn').onclick = hint;
$('notesBtn').onclick = () => { notesMode = !notesMode; render(); };
$('newBtn').onclick = () => {
    if(S.done) return newGame(progress().level);
    const busy = S.v.some((x, i) => x && !S.givens[i]);
    if(busy) return confirmBox('Câu khác?', 'Bỏ câu này và lấy một câu đố khác cùng cấp ' + S.level + '.', 'Câu khác', () => newGame(S.level));
    newGame(S.level);
};
$('restartBtn').onclick = () => confirmBox('Chơi lại?', 'Xóa hết số và ghi chú bạn đã điền, giữ câu đố này.', 'Chơi lại', () => {
    S.v = S.givens.slice(); S.notes = new Array(81).fill(0); S.time = 0; S.done = false; S.hints = 0;
    sel = -1; undoStack = [];
    save(); render(); say('Bắt đầu lại câu đố này.');
});
$('hsBtn').onclick = () => {
    const p = progress();
    openDlg('<h2>Thành tích (máy này)</h2><table class="hs">'
        + '<tr><td>Cấp hiện tại</td><td class="s">' + p.level + '</td></tr>'
        + '<tr><td>Số câu đã giải</td><td class="s">' + (p.solved || 0) + '</td></tr>'
        + '<tr><td>Cấp cao nhất</td><td class="s">' + (p.top || p.level) + '</td></tr>'
        + '</table><p>Cấp 1 có ' + givensFor(1) + ' số cho sẵn; mỗi cấp bớt một số, khó nhất ' + MIN_GIVENS + ' số (từ cấp ' + (FIRST_GIVENS + 1 - MIN_GIVENS) + ').</p><div class="acts">'
        + '<button id="dClear">Chơi lại từ cấp 1</button><button class="pri" id="dClose">Đóng</button></div>', () => {
        $('dClose').onclick = closeDlg;
        $('dClear').onclick = () => confirmBox('Chơi lại từ cấp 1?', 'Cấp và số câu đã giải sẽ về 0. Câu đang chơi bị bỏ.', 'Về cấp 1', () => { store.del(KEY.progress); newGame(1); });
    });
};
$('helpBtn').onclick = () => showHelp();

function showHelp(){
    openDlg('<h2>Luật chơi</h2><ul class="rules">'
        + '<li>Điền số 1–9 vào các ô trống sao cho <b>mỗi hàng, mỗi cột và mỗi ô 3×3</b> có đủ 1–9, không lặp.</li>'
        + '<li>Chạm vào ô rồi chạm số bên dưới. Chạm lại cùng số để xóa. Trên máy tính: gõ số, mũi tên để di chuyển, Delete để xóa.</li>'
        + '<li><b>Ghi chú</b> (phím N): ghi các số có thể vào ô. Đặt một số sẽ tự xóa ghi chú số đó ở hàng, cột, ô 3×3.</li>'
        + '<li>Hai số giống nhau trong cùng hàng, cột hoặc ô 3×3 sẽ hiện <b>màu đỏ</b>. Số sai mà không trùng thì không báo; điền đầy bảng sẽ biết đúng hay chưa.</li>'
        + '<li>Số nhỏ dưới mỗi nút là số lượng còn phải điền. Mỗi câu đố chỉ có một lời giải.</li>'
        + '<li>Bắt đầu ở cấp 1 (dễ). Mỗi câu giải xong lên một cấp, khó hơn một chút.</li>'
        + '<li>Ván đang chơi tự lưu trên máy này.</li>'
        + '</ul><div class="acts"><button class="pri" id="dClose">Đã hiểu</button></div>', () => { $('dClose').onclick = closeDlg; });
}

document.addEventListener('keydown', e => {
    if(window.gameMenuOpen && gameMenuOpen()) return;
    if(!$('dlg').hidden){ if(e.key === 'Escape') closeDlg(); return; }
    if(!S) return;
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); return undo(); }
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    const d = /^Digit([1-9])$|^Numpad([1-9])$/.exec(e.code);
    if(d){ e.preventDefault(); return enter(+(d[1] || d[2])); }
    if(e.key === 'Backspace' || e.key === 'Delete' || e.code === 'Digit0' || e.code === 'Numpad0'){ e.preventDefault(); return erase(); }
    if(e.key === 'n' || e.key === 'N'){ notesMode = !notesMode; return render(); }
    const mv = {ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1}[e.key];
    if(mv && !S.done){
        e.preventDefault();
        if(sel < 0) sel = 40;
        else{
            const r = ROW(sel), c = COL(sel);
            sel = mv === -9 ? ((r + 8) % 9) * 9 + c : mv === 9 ? ((r + 1) % 9) * 9 + c : mv === -1 ? r * 9 + (c + 8) % 9 : r * 9 + (c + 1) % 9;
        }
        render();
    }
});

/* ---------- dialogs ---------- */
function openDlg(html, init){ $('dlgBox').innerHTML = html; $('dlg').hidden = false; init && init(); }
function closeDlg(){ $('dlg').hidden = true; $('dlgBox').innerHTML = ''; }
function confirmBox(title, text, okText, ok){
    openDlg('<h2>' + title + '</h2><p>' + text + '</p><div class="acts"><button id="dNo">Hủy</button><button class="pri" id="dYes">' + okText + '</button></div>', () => {
        $('dNo').onclick = closeDlg;
        $('dYes').onclick = () => { closeDlg(); ok(); };
    });
}
$('dlg').addEventListener('click', e => { if(e.target === $('dlg')) closeDlg(); });

/* ---------- time and saving ---------- */
let ticks = 0;
setInterval(() => {
    if(!S || S.done || document.hidden || !$('dlg').hidden || (window.gameMenuOpen && gameMenuOpen())) return;
    S.time += 1; showTime();
    if(++ticks % 10 === 0) save();
}, 1000);

function save(){ store.set(KEY.game, S); }
function valid(s){
    const nums = (a, max) => Array.isArray(a) && a.length === 81 && a.every(x => Number.isInteger(x) && x >= 0 && x <= max);
    return s && Number.isInteger(s.level) && s.level >= 1 && nums(s.givens, 9) && nums(s.sol, 9) && nums(s.v, 9) && nums(s.notes, 511) && Number.isFinite(s.time)
        && s.sol.every(x => x) && s.givens.every((x, i) => !x || (x === s.sol[i] && s.v[i] === x));
}
document.addEventListener('visibilitychange', () => { if(document.hidden && S) save(); });

/* ---------- start ---------- */
const saved = store.get(KEY.game);
if(valid(saved) && !saved.done){
    S = saved; S.hints = S.hints || 0;
    render(); say('Tiếp tục ván đang chơi.');
}else{
    const first = !saved && !store.get(KEY.progress);
    S = null;
    newGame(progress().level);
    if(first) setTimeout(showHelp, 60);
}
</script>
